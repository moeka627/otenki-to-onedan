<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>移動ルート天気・料金表示アプリ</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>移動ルート天気・料金表示アプリ</h1>
      <p>現在地→目的地のルート、天気、移動手段別の概算料金をまとめて表示します。</p>
    </header>

    <main class="layout">
      <section class="controls" aria-label="検索と設定">
        <div class="control-group">
          <label for="destination-search">目的地検索</label>
          <div class="search-row">
            <input
              id="destination-search"
              type="text"
              placeholder="地名・施設名を入力（例: 徳島駅）"
              autocomplete="off"
            />
            <button id="search-button" type="button">検索</button>
          </div>
          <small>または地図をタップして目的地を指定してください。</small>
          <ul id="search-results" class="search-results"></ul>
        </div>

        <div class="control-group">
          <label for="transport">移動手段（メイン表示）</label>
          <select id="transport">
            <option value="taxi">タクシー（神山町民割引 85% OFF）</option>
            <option value="car">車</option>
            <option value="bus">バス</option>
            <option value="train">電車</option>
          </select>
        </div>

        <div class="control-group inline-option">
          <input id="kamiyama-discount" type="checkbox" checked />
          <label for="kamiyama-discount">神山町民割引を適用（タクシー）</label>
        </div>

        <div class="control-group status-panel">
          <h2>ステータス</h2>
          <p id="status-text">現在地を取得中です...</p>
          <p id="distance-text">距離: -</p>
          <p id="duration-text">所要時間(目安): -</p>
        </div>

        <div class="control-group fare-panel">
          <h2>選択中の概算料金</h2>
          <p id="fare-text">-</p>
          <p id="fare-detail" class="subtle"></p>
        </div>

        <div class="control-group fare-panel">
          <h2>移動手段ごとの比較</h2>
          <div id="fare-comparison" class="comparison-list"></div>
        </div>
      </section>

      <section class="map-and-weather">
        <div id="map" aria-label="地図表示"></div>
        <section class="weather-panel" aria-live="polite">
          <h2>目的地・道中の天気</h2>
          <p class="subtle">ルートを距離ベースで等間隔分割した地点 + 目的地の天気を表示します。</p>
          <div id="weather-list" class="weather-list"></div>
        </section>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js" defer></script>
  </body>
</html>
